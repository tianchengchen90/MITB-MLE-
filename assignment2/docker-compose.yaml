services:
  airflow-init:
    image: apache/airflow:2.6.1
    user: "0:0" # Run as root to chown and su
    environment:
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    
    entrypoint: |
      /bin/bash -lc '
        set -euo pipefail
        
        # Set permissions for the airflow user
        chown -R 50000:0 /opt/airflow
        chmod -R g+w /opt/airflow
        
        # Check if the database file already exists.
        # Only initialize and create user if it does NOT exist.
        if [ ! -f "/opt/airflow/airflow.db" ]; then
          echo "Database not found. Initializing..."
          # Use "su" instead of "gosu" to switch to the airflow user
          su -s /bin/bash airflow -c "airflow db init"
          su -s /bin/bash airflow -c "airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
        else
          echo "Database already exists. Skipping init."
        fi
        
        ls -l /opt/airflow/airflow.db
      '

  airflow-webserver:
    image: apache/airflow:2.6.1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    environment:
      # --- ADDED ---
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      # ---
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.6.1
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    # --- ADDED ---
    user: "${AIRFLOW_UID:-50000}:0"
    # ---
    environment:
      # --- ADDED ---
      - AIRFLOW_HOME=/opt/airflow
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      # ---
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: scheduler

volumes:
  airflow_data:
